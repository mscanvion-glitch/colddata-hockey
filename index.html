<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#030712">
  <title>ColdData Hockey</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#030712] text-gray-100 min-h-screen pb-12 font-sans selection:bg-emerald-500/20">

  <div class="max-w-md mx-auto px-4 pt-6 space-y-6">

    <!-- Header & Horodatage -->
    <div class="flex items-center justify-between border-b border-gray-800/80 pb-4">
      <div>
        <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
          ColdData Scanner
        </h1>
        <p class="text-xs text-gray-500 mt-0.5" id="last-update">Chargement du flux...</p>
      </div>
      <button onclick="loadReport()" class="p-2.5 bg-gray-900 border border-gray-800 rounded-xl text-gray-400 hover:text-white active:scale-95 transition">
        ↻
      </button>
    </div>

    <!-- Bankroll Management -->
    <div class="bg-gray-900/60 border border-gray-800/80 rounded-2xl p-4 shadow-xl backdrop-blur-sm space-y-3">
      <div class="flex justify-between items-center text-xs text-gray-400 font-medium">
        <span>SOLDES ACTUELS</span>
        <span class="text-emerald-400" id="total-bankroll">-- €</span>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-gray-950/70 border border-gray-800/50 rounded-xl p-2.5">
          <label class="text-[10px] text-gray-500 block uppercase font-mono">Winamax (€)</label>
          <input type="number" id="winamax-val" value="386" oninput="saveAndRefresh()" class="w-full bg-transparent text-sm font-semibold text-white focus:outline-none">
        </div>
        <div class="bg-gray-950/70 border border-gray-800/50 rounded-xl p-2.5">
          <label class="text-[10px] text-gray-500 block uppercase font-mono">Polymarket ($)</label>
          <input type="number" id="poly-val" value="347" oninput="saveAndRefresh()" class="w-full bg-transparent text-sm font-semibold text-white focus:outline-none">
        </div>
      </div>
    </div>

    <!-- Feed des Matchs -->
    <div class="space-y-4">
      <div class="flex items-center justify-between text-xs font-semibold uppercase tracking-wider text-gray-400">
        <span>Rapport de décision froid</span>
        <span id="badge-count" class="bg-emerald-950 text-emerald-400 border border-emerald-800/60 px-2 py-0.5 rounded-md font-mono text-[10px]">--</span>
      </div>

      <div id="cards-container" class="space-y-3">
        <p class="text-xs text-gray-500 text-center py-6">Lecture des données...</p>
      </div>
    </div>

  </div>

  <script>
    let currentData = null;

    function saveAndRefresh() {
      const w = parseFloat(document.getElementById('winamax-val').value) || 0;
      const p = parseFloat(document.getElementById('poly-val').value) || 0;
      localStorage.setItem('colddata_w', w);
      localStorage.setItem('colddata_p', p);
      document.getElementById('total-bankroll').innerText = (w + p).toFixed(2) + " € (consolidé)";
      if (currentData) renderCards(currentData);
    }

    async function loadReport() {
      try {
        const res = await fetch('data.json?t=' + Date.now());
        if (!res.ok) throw new Error("Fichier introuvable");
        const data = await res.json();
        currentData = data;
        document.getElementById('last-update').innerText = "Dernier scan : " + data.updated_at;
        document.getElementById('badge-count').innerText = data.total_scanned + " MATCHS";
        renderCards(data);
      } catch (err) {
        document.getElementById('cards-container').innerHTML = `
          <div class="p-4 bg-red-950/20 border border-red-900/40 rounded-xl text-center text-xs text-red-400">
            En attente du premier scan GitHub Actions.<br>Déclenche le workflow dans l'onglet Actions.
          </div>`;
      }
    }

    function renderCards(data) {
      const container = document.getElementById('cards-container');
      container.innerHTML = '';

      const w = parseFloat(document.getElementById('winamax-val').value) || 0;
      const p = parseFloat(document.getElementById('poly-val').value) || 0;

      data.results.forEach(m => {
        const isOk = m.status.includes('VALIDÉE') || m.status.includes('VALUE') || m.status.includes('MODÉRÉ');
        
        let card = document.createElement('div');
        card.className = `p-4 rounded-2xl border transition ${
          isOk ? 'bg-gradient-to-b from-gray-900 to-gray-950 border-emerald-500/40 shadow-lg shadow-emerald-950/20' : 'bg-gray-950/40 border-gray-900 opacity-60'
        }`;

        let miseW = ((w * m.stake_pct) / 100).toFixed(2);
        let miseP = ((p * m.stake_pct) / 100).toFixed(2);

        card.innerHTML = `
          <div class="flex items-start justify-between">
            <div>
              <span class="text-[10px] font-mono uppercase px-1.5 py-0.5 rounded ${isOk ? 'bg-emerald-950 text-emerald-400 border border-emerald-800/60' : 'bg-gray-800 text-gray-400'}">${m.league} • ${m.time}</span>
              <h3 class="text-sm font-bold text-white mt-1.5">${m.match}</h3>
              <p class="text-[11px] text-gray-400 mt-0.5">Gardien : ${m.gardien}</p>
            </div>
            <div class="text-right">
              <span class="text-xs font-mono font-bold ${isOk ? 'text-emerald-400' : 'text-gray-500'}">@${m.cote.toFixed(2)}</span>
              <p class="text-[10px] text-gray-500 font-mono mt-0.5">${m.score > 0 ? m.score.toFixed(1) + '/100' : 'ÉLIMINÉ'}</p>
            </div>
          </div>

          ${isOk ? `
            <div class="mt-3 pt-3 border-t border-gray-800/80 flex items-center justify-between text-xs">
              <span class="text-emerald-400 font-medium">Mise conseillée (${m.stake_pct}%) :</span>
              <span class="font-mono text-white font-semibold">${miseW} € (W) / ${miseP}$ (P)</span>
            </div>
          ` : `
            <div class="mt-2.5 pt-2 border-t border-gray-900 text-[11px] text-red-400/80 space-y-0.5">
              ${m.motifs.map(mot => `<div>• ${mot}</div>`).join('')}
            </div>
          `}
        `;
        container.appendChild(card);
      });
    }

    // Initialisation
    const savedW = localStorage.getItem('colddata_w');
    const savedP = localStorage.getItem('colddata_p');
    if (savedW) document.getElementById('winamax-val').value = savedW;
    if (savedP) document.getElementById('poly-val').value = savedP;
    saveAndRefresh();
    loadReport();
  </script>
</body>
</html>
