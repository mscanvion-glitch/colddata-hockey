<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ColdData Hockey | Pro Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #050811; color: #f8fafc; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .glass-card {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.7) 0%, rgba(30, 41, 59, 0.4) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }
    .glass-pill {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    /* Animation de pulsation douce */
    @keyframes pulse-soft {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.97); }
    }
    .animate-pulse-soft { animation: pulse-soft 3s infinite ease-in-out; }
  </style>
</head>
<body class="min-h-screen p-4 pb-24 antialiased flex justify-center">
  <div class="w-full max-w-md space-y-4">
    
    <!-- HEADER PRO ÉPURÉ -->
    <header class="glass-pill p-4 rounded-3xl shadow-2xl flex justify-between items-center relative overflow-hidden">
      <div class="absolute -left-10 -top-10 w-24 h-24 bg-emerald-500/10 rounded-full blur-2xl"></div>
      <div class="flex items-center space-x-3 relative z-10">
        <div class="relative">
          <div class="w-3 h-3 rounded-full bg-emerald-500"></div>
          <div class="absolute inset-0 w-3 h-3 rounded-full bg-emerald-500 animate-ping opacity-75"></div>
        </div>
        <div>
          <h1 class="text-xs font-bold tracking-wider uppercase text-slate-400">Terminal <span class="text-white">ColdData</span></h1>
          <span class="text-[11px] font-medium text-emerald-400 mono" id="update-time">Synchronisation...</span>
        </div>
      </div>
      <button onclick="toggleConfig()" class="relative z-10 bg-slate-800/60 hover:bg-slate-700/80 border border-slate-700/50 p-2.5 rounded-2xl text-slate-300 transition active:scale-95 shadow-inner">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
      </button>
    </header>

    <!-- TIROIR DE CONFIGURATION FLUIDE -->
    <div id="config-panel" class="hidden glass-card p-5 rounded-3xl space-y-4 shadow-2xl transition-all duration-300 border border-slate-700/50">
      <div class="flex justify-between items-center border-b border-slate-800/80 pb-3">
        <span class="text-xs font-bold text-white tracking-wide uppercase">Paramétrage & Seuils Stricts</span>
        <button onclick="toggleConfig()" class="text-slate-400 hover:text-white text-sm font-bold bg-slate-800/50 w-7 h-7 rounded-xl flex items-center justify-center">✕</button>
      </div>
      <div class="grid grid-cols-2 gap-3 text-xs">
        <div class="space-y-1">
          <label class="text-slate-400 font-medium">Seuil Tier 1</label>
          <input type="number" id="cfg-t1" value="85" class="w-full bg-slate-950/80 border border-slate-800 p-2.5 rounded-xl text-white mono focus:border-emerald-500 outline-none shadow-inner">
        </div>
        <div class="space-y-1">
          <label class="text-slate-400 font-medium">Seuil Tier 2</label>
          <input type="number" id="cfg-t2" value="82" class="w-full bg-slate-950/80 border border-slate-800 p-2.5 rounded-xl text-white mono focus:border-emerald-500 outline-none shadow-inner">
        </div>
        <div class="space-y-1">
          <label class="text-slate-400 font-medium">Seuil Tier 3</label>
          <input type="number" id="cfg-t3" value="79" class="w-full bg-slate-950/80 border border-slate-800 p-2.5 rounded-xl text-white mono focus:border-emerald-500 outline-none shadow-inner">
        </div>
        <div class="space-y-1">
          <label class="text-slate-400 font-medium">Corridor Max</label>
          <input type="number" step="0.01" id="cfg-cmax" value="1.55" class="w-full bg-slate-950/80 border border-slate-800 p-2.5 rounded-xl text-white mono focus:border-emerald-500 outline-none shadow-inner">
        </div>
      </div>
      <button onclick="saveConfig()" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-semibold py-3 rounded-2xl transition shadow-lg shadow-emerald-900/30 text-xs active:scale-[0.98]">Enregistrer les modifications</button>
    </div>

    <!-- BARRE DE NAVIGATION STYLE APP NATIVE -->
    <nav class="glass-pill p-1.5 rounded-2xl grid grid-cols-4 gap-1 text-[11px] font-semibold text-slate-400 shadow-xl">
      <button onclick="switchTab('valid')" id="btn-valid" class="py-2.5 text-center rounded-xl bg-emerald-600 text-white shadow-lg shadow-emerald-900/40 transition-all">Validés</button>
      <button onclick="switchTab('rejected')" id="btn-rejected" class="py-2.5 text-center rounded-xl hover:text-white transition-all">Écartés</button>
      <button onclick="switchTab('calendar')" id="btn-calendar" class="py-2.5 text-center rounded-xl hover:text-white transition-all">J+1</button>
      <button onclick="switchTab('audit')" id="btn-audit" class="py-2.5 text-center rounded-xl hover:text-white transition-all">Audit</button>
    </nav>

    <!-- CONTENEURS D'ONGLETS -->
    <main class="space-y-3">
      <section id="tab-valid" class="space-y-3"></section>
      <section id="tab-rejected" class="space-y-3 hidden"></section>
      
      <!-- CALENDRIER J+1 -->
      <section id="tab-calendar" class="space-y-3 hidden">
        <div class="glass-card p-5 rounded-3xl space-y-3 shadow-2xl">
          <div class="flex justify-between items-center text-xs font-bold text-white border-b border-slate-800/80 pb-2.5">
            <span>📅 Anticipation & Flux J+1</span>
            <span class="text-emerald-400 bg-emerald-950/60 border border-emerald-900/50 px-2.5 py-0.5 rounded-full text-[10px]">Actif</span>
          </div>
          <div id="calendar-list" class="space-y-2.5">
            <div class="p-3.5 bg-slate-950/50 rounded-2xl border border-slate-800/60 text-xs text-slate-400 text-center">Chargement du calendrier...</div>
          </div>
        </div>
      </section>

      <!-- AUDIT / ROI -->
      <section id="tab-audit" class="space-y-3 hidden">
        <div class="glass-card p-5 rounded-3xl space-y-4 shadow-2xl">
          <div class="text-xs font-bold text-white tracking-wide uppercase">Rapport de Performance Global</div>
          <div class="grid grid-cols-2 gap-3 text-xs">
            <div class="bg-slate-950/60 p-3.5 rounded-2xl border border-slate-800/60 space-y-1.5 shadow-inner">
              <span class="text-slate-400 text-[10px] uppercase tracking-wider block">Winrate Global</span>
              <span class="text-emerald-400 font-bold mono text-base">-- %</span>
            </div>
            <div class="bg-slate-950/60 p-3.5 rounded-2xl border border-slate-800/60 space-y-1.5 shadow-inner">
              <span class="text-slate-400 text-[10px] uppercase tracking-wider block">ROI Net Simulé</span>
              <span class="text-emerald-400 font-bold mono text-base">-- %</span>
            </div>
          </div>
          <div class="flex justify-between items-center text-xs text-slate-300 px-2 pt-1 bg-slate-950/40 py-3 rounded-2xl border border-slate-800/50">
            <span>Total paris suivis par le bot :</span>
            <span class="text-white font-bold mono text-sm">0</span>
          </div>
        </div>
      </section>
    </main>

  </div>

  <script>
    function toggleConfig() {
      document.getElementById('config-panel').classList.toggle('hidden');
    }

    function saveConfig() {
      alert("Paramètres mis à jour avec succès !");
      toggleConfig();
    }

    function switchTab(tab) {
      ['valid', 'rejected', 'calendar', 'audit'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
        document.getElementById(`btn-${t}`).className = "py-2.5 text-center rounded-xl text-slate-400 hover:text-white transition-all";
      });
      document.getElementById(`tab-${tab}`).classList.remove('hidden');
      document.getElementById(`btn-${tab}`).className = "py-2.5 text-center rounded-xl bg-emerald-600 text-white shadow-lg shadow-emerald-900/40 transition-all font-semibold";
    }

    async function loadData() {
      try {
        const res = await fetch('data.json?t=' + Date.now());
        const data = await res.json();
        
        document.getElementById('update-time').innerText = "Sync : " + data.updated_at;
        
        const validDiv = document.getElementById('tab-valid');
        const rejectedDiv = document.getElementById('tab-rejected');
        const calendarDiv = document.getElementById('calendar-list');
        
        validDiv.innerHTML = '';
        rejectedDiv.innerHTML = '';
        calendarDiv.innerHTML = '';

        data.results.forEach(m => {
          const isValid = m.status.includes('VALIDÉE') || m.status.includes('VALUE') || m.status.includes('MODÉRÉ');
          const analyseText = m.analyse || 'Analyse détaillée non disponible.';
          
          const card = document.createElement('div');
          card.className = "glass-card p-4.5 rounded-3xl text-xs space-y-3.5 shadow-xl hover:border-slate-600/50 transition-all duration-300";
          
          if (isValid) {
            card.innerHTML = `
              <div class="flex justify-between items-start">
                <div>
                  <span class="text-[10px] uppercase tracking-wider text-emerald-400 font-bold bg-emerald-950/80 px-2.5 py-1 rounded-lg border border-emerald-900/50">${m.league || 'NHL'}</span>
                  <h3 class="font-bold text-white text-sm mt-2 tracking-tight">${m.match}</h3>
                </div>
                <div class="text-right">
                  <span class="text-emerald-400 font-bold mono text-sm bg-emerald-950/60 px-3 py-1.5 rounded-xl border border-emerald-900/40 shadow-sm">@${m.cote}</span>
                  <span class="text-[10px] text-slate-400 block mt-1.5 mono">${m.time}</span>
                </div>
              </div>
              
              <div class="grid grid-cols-2 gap-2 bg-slate-950/60 p-3 rounded-2xl border border-slate-800/60">
                <div>
                  <span class="text-[9px] text-slate-400 uppercase tracking-wider block font-semibold">Statut Clinique</span>
                  <strong class="text-emerald-300 text-[11px]">${m.status}</strong>
                </div>
                <div>
                  <span class="text-[9px] text-slate-400 uppercase tracking-wider block font-semibold">Score Global</span>
                  <strong class="text-white text-[11px] mono">${m.score}/100</strong>
                </div>
              </div>

              <div class="flex justify-between items-center text-[11px] text-slate-300 px-1">
                <span>Gardien : <span class="text-white font-medium">${m.gardien}</span></span>
                <span>Mise : <span class="text-emerald-400 font-bold mono">${m.stake_pct}%</span></span>
              </div>

              <div class="p-3 bg-slate-950/90 rounded-2xl border border-slate-800/80 text-slate-300 text-[11px] italic leading-relaxed shadow-inner">
                "${analyseText}"
              </div>
            `;
            validDiv.appendChild(card);
          } else {
            card.innerHTML = `
              <div class="flex justify-between items-start">
                <div>
                  <span class="text-[10px] uppercase tracking-wider text-rose-400 font-bold bg-rose-950/80 px-2.5 py-1 rounded-lg border border-rose-900/50">${m.league || 'NHL'}</span>
                  <h3 class="font-bold text-slate-100 text-sm mt-2 tracking-tight">${m.match}</h3>
                </div>
                <div class="text-right">
                  <span class="text-slate-400 font-bold mono text-sm bg-slate-950 px-3 py-1.5 rounded-xl border border-slate-800">@${m.cote}</span>
                  <span class="text-[10px] text-slate-500 block mt-1.5 mono">${m.time}</span>
                </div>
              </div>

              <div class="space-y-1.5 bg-slate-950/60 p-3 rounded-2xl border border-slate-800/60">
                <span class="text-[10px] text-rose-400 font-bold uppercase tracking-wider block">Motifs de rejet :</span>
                <ul class="list-disc list-inside text-slate-400 text-[11px] space-y-1">
                  ${m.motifs.map(motiff => `<li>${motiff}</li>`).join('')}
                </ul>
              </div>

<div class="p-3 bg-slate-950/90 rounded-2xl border border-slate-800/80 text-slate-400 text-[11px] italic leading-relaxed shadow-inner">
                "${analyseText}"
              </div>
            `;
            rejectedDiv.appendChild(card);
          }
        });

        if (data.calendar_j1 && data.calendar_j1.length > 0) {
          data.calendar_j1.forEach(cal => {
            const calItem = document.createElement('div');
            calItem.className = "p-3.5 bg-slate-950/60 rounded-2xl border border-slate-800/80 flex justify-between items-center text-xs shadow-sm";
            calItem.innerHTML = `
              <div>
                <span class="text-[9px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded-md font-mono font-bold">${cal.league}</span>
                <div class="font-bold text-white mt-1.5">${cal.match}</div>
              </div>
              <div class="text-right">
                <span class="text-emerald-400 mono text-[11px] font-bold bg-emerald-950/40 px-2.5 py-1 rounded-xl border border-emerald-900/30">${cal.time}</span>
              </div>
            `;
            calendarDiv.appendChild(calItem);
          });
        } else {
          calendarDiv.innerHTML = '<div class="p-4 bg-slate-950/60 rounded-2xl border border-slate-800 text-xs text-slate-500 text-center">Aucun match J+1 trouvé dans le flux.</div>';
        }

        if (validDiv.children.length === 0) {
          validDiv.innerHTML = '<div class="glass-card rounded-3xl p-8 text-center text-xs text-slate-500">Aucun match validé par le filtre strict pour le moment.</div>';
        }
        if (rejectedDiv.children.length === 0) {
          rejectedDiv.innerHTML = '<div class="glass-card rounded-3xl p-8 text-center text-xs text-slate-500">Aucun match écarté pour le moment.</div>';
        }

      } catch (e) {
        document.getElementById('update-time').innerText = "Erreur de sync flux";
      }
    }

    loadData();
  </script>
</body>
</html>
