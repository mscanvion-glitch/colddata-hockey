<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ColdData Hockey</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-4 font-sans">
  <div class="max-w-md mx-auto space-y-4">
    
    <div class="flex justify-between items-center border-b border-gray-800 pb-3">
      <h1 class="text-base font-bold text-white">ColdData Hockey</h1>
      <span class="text-xs text-emerald-400" id="update-time">Chargement...</span>
    </div>

    <!-- Onglets -->
    <div class="flex bg-gray-900 rounded-lg p-1 text-xs font-semibold">
      <button onclick="showTab('valid')" id="btn-valid" class="flex-1 py-2 text-center rounded bg-emerald-600 text-white">Validés</button>
      <button onclick="showTab('rejected')" id="btn-rejected" class="flex-1 py-2 text-center rounded text-gray-400">Écartés</button>
    </div>

    <!-- Contenu Validés -->
    <div id="tab-content-valid" class="space-y-3">
      <div id="list-valid" class="space-y-2"></div>
    </div>

    <!-- Contenu Écartés -->
    <div id="tab-content-rejected" class="space-y-3 hidden">
      <div id="list-rejected" class="space-y-2"></div>
    </div>

  </div>

  <script>
    function showTab(tab) {
      if (tab === 'valid') {
        document.getElementById('tab-content-valid').classList.remove('hidden');
        document.getElementById('tab-content-rejected').classList.add('hidden');
        document.getElementById('btn-valid').className = "flex-1 py-2 text-center rounded bg-emerald-600 text-white";
        document.getElementById('btn-rejected').className = "flex-1 py-2 text-center rounded text-gray-400";
      } else {
        document.getElementById('tab-content-rejected').classList.remove('hidden');
        document.getElementById('tab-content-valid').classList.add('hidden');
        document.getElementById('btn-rejected').className = "flex-1 py-2 text-center rounded bg-emerald-600 text-white";
        document.getElementById('btn-valid').className = "flex-1 py-2 text-center rounded text-gray-400";
      }
    }

    async function loadData() {
      try {
        const res = await fetch('data.json?t=' + Date.now());
        const data = await res.json();
        
        document.getElementById('update-time').innerText = data.updated_at;
        
        const validList = document.getElementById('list-valid');
        const rejectedList = document.getElementById('list-rejected');
        validList.innerHTML = '';
        rejectedList.innerHTML = '';

        data.results.forEach(m => {
          const isValid = m.status.includes('VALIDÉE') || m.status.includes('VALUE') || m.status.includes('MODÉRÉ');
          
          const card = document.createElement('div');
          card.className = "p-3 bg-gray-900 border border-gray-800 rounded-lg text-xs space-y-1";
          
          if (isValid) {
            card.innerHTML = `
              <div class="font-bold text-white flex justify-between">
                <span>${m.match}</span>
                <span class="text-emerald-400">@${m.cote}</span>
              </div>
              <div class="text-gray-400">Statut : <span class="text-emerald-300">${m.status}</span></div>
              <div class="text-gray-400">Score : ${m.score}/100 | Gardien : ${m.gardien}</div>
            `;
            validList.appendChild(card);
          } else {
            card.innerHTML = `
              <div class="font-bold text-gray-300 flex justify-between">
                <span>${m.match}</span>
                <span class="text-gray-500">@${m.cote}</span>
              </div>
              <div class="text-red-400">Motifs : ${m.motifs.join(', ')}</div>
            `;
            rejectedList.appendChild(card);
          }
        });

        if (validList.children.length === 0) {
          validList.innerHTML = '<p class="text-xs text-gray-500 text-center py-4">Aucun match validé pour le moment.</p>';
        }
        if (rejectedList.children.length === 0) {
          rejectedList.innerHTML = '<p class="text-xs text-gray-500 text-center py-4">Aucun match écarté.</p>';
        }

      } catch (e) {
        document.getElementById('update-time').innerText = "Erreur de chargement";
      }
    }

    loadData();
  </script>
</body>
</html>
